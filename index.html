    <!-- Apply a saved theme before React loads, so there's no flash -->
    <script>
      try {
        var t = localStorage.getItem('theme');
        if (t === 'dark' || t === 'light') { document.documentElement.dataset.theme = t; document.documentElement.style.colorScheme = t; }
      } catch (e) {}
    </script>
